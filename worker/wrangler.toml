# Ask Gati Worker. Deploy: see worker/README.md. The Anthropic key is a secret (wrangler secret put ANTHROPIC_API_KEY), never in this file or the static site.
name = "gati-ask"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
MODEL = "claude-haiku-4-5"            # or "claude-sonnet-4-5" for higher quality, about 3x the cost
MAX_TOKENS = "900"
DATA_BASE = "https://nirajbhusal.github.io/gati-alerts/"
ALLOWED_ORIGINS = "https://nirajbhusal.github.io,http://localhost:8933,http://127.0.0.1:8933"
MAX_QUESTION_CHARS = "400"
PER_IP_PER_MIN = "6"
PER_IP_PER_DAY = "60"
DAILY_CAP = "2000"

# Rate limit and daily cap counters. Create with: npx wrangler kv namespace create GATI_ASK_KV, then paste the id.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
