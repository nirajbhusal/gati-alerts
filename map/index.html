</head><body data-page="map" data-root="../"><main id="main" class="wrap dash">
<h1><span class="ne-only">नक्सा</span><span class="en-only">Map</span></h1>
<div class="mydist" id="mydist"></div><div id="nearbyslot"></div><section class="mapsec" aria-labelledby="hmap">
    <div class="sechead first"><span id="hmap"></span>
      <div class="seg" role="group" aria-label="Map scope">
        <button type="button" data-scope="active"><span class="ne-only">चालु मात्र</span><span class="en-only">Active only</span></button>
        <button type="button" data-scope="30"><span class="ne-only">पछिल्ला ३० दिन</span><span class="en-only">Last 30 days</span></button></div></div>
    <div class="chipbar" role="group" aria-label="Map layers">
      <button type="button" class="lchip" data-layer="alerts" aria-pressed="true"><span aria-hidden="true">⚠</span> <span class="ne-only">सूचना</span><span class="en-only">Alerts</span></button>
      <button type="button" class="lchip" data-layer="roads" aria-pressed="true"><span aria-hidden="true">🛣</span> <span class="ne-only">सडक</span><span class="en-only">Roads</span></button>
      <button type="button" class="lchip" data-layer="rivers" aria-pressed="true"><span aria-hidden="true">💧</span> <span class="ne-only">नदी</span><span class="en-only">Rivers</span></button>
    </div>
    <div class="mapgrid">
      <div class="mapcol"><div id="map" role="region" aria-label="Map of alert areas, road status and river gauges"></div>
        <div class="maplegend" id="mapLegend"></div></div>
      <aside class="side">
        <div class="card sumcard" id="sumcard" aria-live="polite"></div>
        <div class="card roadlist" id="roads"><h3><span class="ne-only">मुख्य सडकको अवस्था</span><span class="en-only">Main road status</span></h3><ol id="roadList"></ol></div>
      </aside>
    </div>
    <p class="meta" id="mapNote"></p>
  </section>
