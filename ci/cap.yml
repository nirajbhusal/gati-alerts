# Pages is served from the main branch (legacy build), so this workflow only validates and
# rebuilds feed.xml and data/alerts.json; the branch push then republishes the site.
name: Validate CAP and rebuild feed
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"   # daily 05:00 NPT: refresh expiry flags and feed timestamp
permissions:
  contents: write
concurrency:
  group: cap-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml==5.3.0
      - name: Validate every CAP file against the OASIS CAP 1.2 XSD + Gati profile
        run: python scripts/build.py --check
      - name: DoR NAVIGATE road closures (daily; keeps last good data on failure)
        run: python scripts/fetch_navigate.py
      - name: Regenerate feed.xml and data/alerts.json
        run: python scripts/build.py
      - name: Commit regenerated feed (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "gati-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml data/alerts.json data/navigate.json data/source-health.json data/raw/navigate-*.json
          git diff --cached --quiet || (git commit -m "Rebuild CAP feed [skip ci]" && git push)
