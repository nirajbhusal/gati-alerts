# Build the Android preview APK and the unsigned release APK/AAB.
# Signs a release only when repository secrets are present.
# Does not deploy GitHub Pages, tag a release, or upload to Google Play.

name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore when a secret is configured
        env:
          GATI_ANDROID_KEYSTORE_BASE64: ${{ secrets.GATI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GATI_ANDROID_KEYSTORE_BASE64}" ]; then
            echo "No GATI_ANDROID_KEYSTORE_BASE64 secret. Release artifacts stay unsigned."
            exit 0
          fi
          umask 077
          printf '%s' "${GATI_ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/gati-release.keystore"
          echo "GATI_ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/gati-release.keystore" >> "${GITHUB_ENV}"

      - name: Build
        working-directory: android
        env:
          GATI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GATI_ANDROID_KEYSTORE_PASSWORD }}
          GATI_ANDROID_KEY_ALIAS: ${{ secrets.GATI_ANDROID_KEY_ALIAS }}
          GATI_ANDROID_KEY_PASSWORD: ${{ secrets.GATI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Name artifacts and checksums
        working-directory: android
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/gati-android"
          mkdir -p "${out}"
          cp app/build/outputs/apk/debug/gati-alerts-debug.apk "${out}/gati-alerts-1.0.0-preview-debug.apk"
          if [ -f app/build/outputs/apk/release/gati-alerts-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/gati-alerts-release-unsigned.apk "${out}/gati-alerts-1.0.0-release-unsigned.apk"
          elif [ -f app/build/outputs/apk/release/gati-alerts-release.apk ]; then
            cp app/build/outputs/apk/release/gati-alerts-release.apk "${out}/gati-alerts-1.0.0-release-signed.apk"
          else
            echo "No release APK was produced." >&2
            exit 1
          fi
          aab="$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          if [ -z "${aab}" ]; then
            echo "No release AAB was produced." >&2
            exit 1
          fi
          if jarsigner -verify "${aab}" >/dev/null 2>&1; then
            cp "${aab}" "${out}/gati-alerts-1.0.0-release-signed.aab"
          else
            cp "${aab}" "${out}/gati-alerts-1.0.0-release-unsigned.aab"
          fi
          (
            cd "${out}"
            sha256sum gati-alerts-* > SHA256SUMS
          )
          echo "Artifacts:"
          ls -l "${out}"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: gati-alerts-android-${{ github.sha }}
          path: ${{ runner.temp }}/gati-android/
          if-no-files-found: error
