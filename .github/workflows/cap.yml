name: Validate CAP, build feed, deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"   # daily 05:00 NPT: refresh expiry flags and feed timestamp
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml==5.3.0
      - name: Validate every CAP file against the OASIS CAP 1.2 XSD + Gati profile
        run: python scripts/build.py --check
      - name: Regenerate feed.xml and data/alerts.json
        run: python scripts/build.py
      - name: Commit regenerated feed (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "gati-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml data/alerts.json
          git diff --cached --quiet || (git commit -m "Rebuild CAP feed [skip ci]" && git push)
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
