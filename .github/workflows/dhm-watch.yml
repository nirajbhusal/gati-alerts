# Read-only DHM page check. Does not commit, push, or call a write API.
# A newer DHM id is written to the job summary and the job fails, so GitHub's
# failed-workflow email can reach the owner.
name: DHM watch
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours; GitHub reads cron in UTC, so runs fall at :45 past odd hours NPT (7:45, 9:45 ... 19:45), after DHM's 8 AM and 6 PM bulletins
  workflow_dispatch:
env:
  TZ: Asia/Kathmandu   # Gati runs on Nepal time (UTC+5:45)

permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare DHM page ids with the repo
        run: python scripts/dhm_watch.py
