name: "नागरिक रिपोर्ट / Citizen hazard report"
description: "बाढी, पहिरो, बाटो बन्द जस्ता खतरा देख्नुभयो? Report a hazard you saw. Public; not an emergency line (call 100/101/102/1149)."
title: "[Report] "
labels: ["reported", "citizen-report"]
body:
  - type: markdown
    attributes:
      value: |
        **ज्यान जोखिममा छ भने अहिल्यै १००, १०१, १०२ वा ११४९ मा फोन गर्नुहोस्।** If life is at risk, call 100, 101, 102 or 1149 now.

        यो रिपोर्ट **सार्वजनिक** हुन्छ र मोडेरेटरले नजाँचेसम्म *रिपोर्ट गरिएको — पुष्टि भएको छैन* भनी देखिन्छ। This report is **public** and is shown as *Reported — not confirmed* until a moderator checks it.
        **फोन नम्बर, इमेल वा अरूको नाम यहाँ नलेख्नुहोस्।** Do not put phone numbers, emails or other people's names here.
  - type: dropdown
    id: hazard
    attributes:
      label: "जोखिमको प्रकार / Hazard type"
      options:
        - "बाढी / Flood"
        - "पहिरो / Landslide"
        - "सडक अवरोध / Road blocked"
        - "पुल क्षति / Bridge damage"
        - "भारी वर्षा / Heavy rain"
        - "हिमताल/हिमपहिरो / Glacial lake or avalanche"
        - "भूकम्प / Earthquake"
        - "आगलागी / Fire"
        - "बिजुली/सञ्चार अवरोध / Power or telecom outage"
        - "अन्य / Other"
    validations:
      required: true
  - type: input
    id: district
    attributes:
      label: "जिल्ला / District"
    validations:
      required: true
  - type: input
    id: municipality
    attributes:
      label: "नगर/गाउँपालिका / Municipality"
  - type: input
    id: ward
    attributes:
      label: "वडा नं. / Ward no."
  - type: input
    id: place
    attributes:
      label: "ठाउँ / Place or landmark"
  - type: input
    id: gps
    attributes:
      label: "GPS (lat, lon)"
      description: "४ दशमलवसम्म (करिब ११ मि.) / Up to 4 decimals (about 11 m)"
  - type: input
    id: observed
    attributes:
      label: "देखेको समय / Time observed (NPT)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "के देख्नुभयो? / What did you see?"
      description: "आफैँले देख्नुभएको कुरा मात्र लेख्नुहोस्। तस्विर थप्न यहाँ तानेर राख्नुहोस् (सबैले देख्छन्)। Only what you saw yourself. Drag a photo here to attach it (it will be public)."
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: "सहमति / Consent"
      options:
        - label: "यो रिपोर्ट सबैले देख्छन् भन्ने मलाई थाहा छ, र यो मैले आफैँ देखेको साँचो कुरा हो। I understand this report is public and it is a true account of what I saw."
          required: true
